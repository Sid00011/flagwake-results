# Flagwake runs of the models in settings.json (see PLAN.md).
#
# Signed runs call Flagwake's signing workflow at release v0.5.0rc5 with Flagwake's own model
# agent. The signature names that workflow as the signer and this repository's commit as the
# caller, so the settings of a run are the ones in this file and in settings.json at that commit.
#
# Start it by hand: Actions > results > Run workflow.
#   smoke   unsigned: two public practice incidents per model (or only the model named in
#           "only"), to check that the model answers; it draws no attempt number, uploads nothing
#   wiring  signed, no model: checks that the secret arrives and that signing works
#   <name>  signed: one model, for its first run or a repeat that PLAN.md allows
# There is no "every model" choice, so no click can run a finished model again.
# The names in the choice list below must match the "name" fields of settings.json.
name: results

on:
  workflow_dispatch:
    inputs:
      run:
        description: smoke, wiring, or one model from settings.json
        type: choice
        options: [smoke, wiring, gemini-3.5-flash-lite, gemma-4-31b-it, gemma-4-26b-a4b-it]
      only:
        description: "smoke only: one model's name (empty: every model)"
        type: string
        default: ""

permissions:
  contents: read

# One run at a time: two signed runs started together would read the same next attempt number.
concurrency:
  group: flagwake-results
  cancel-in-progress: false

jobs:
  smoke:
    if: inputs.run == 'smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Install Flagwake
        run: python -m pip install --disable-pip-version-check --quiet "flagwake[provenance] @ git+https://github.com/Sid00011/Flagwake@v0.5.0rc5"
      - name: Two practice incidents per model (unsigned, no attempt number)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONLY: ${{ inputs.only }}
        run: |
          python -I - <<'PY'
          import json, os, subprocess
          cfg = json.load(open("settings.json", encoding="utf-8"))
          for m in cfg["models"]:
              if os.environ.get("ONLY") and m["name"] != os.environ["ONLY"]:
                  continue
              out = f"smoke-{m['name']}"
              env = dict(os.environ, FLAGWAKE_LLM_BASE_URL=m["base"], FLAGWAKE_LLM_MODEL=m["model"],
                         FLAGWAKE_LLM_EXTRA_BODY=m["extra"],
                         FLAGWAKE_LLM_KEY=os.environ.get(m["key"], ""))
              argv = ["flagwake", "check", "--agent", cfg["agent"], "--pack", "practice",
                      "--seeds", "1", "--family", "quiet", "--family", "log-injection",
                      "--step-timeout", cfg["step-timeout"],
                      "--incident-timeout", cfg["incident-timeout"], "--out", out]
              print(f"=== {m['name']}: {' '.join(argv[1:])}", flush=True)
              subprocess.run(argv, env=env)
              print(open(f"{out}/agent-stderr.log", encoding="utf-8").read(), flush=True)
              doc = json.load(open(f"{out}/report.json", encoding="utf-8"))
              for inc in doc["incidents"]:
                  print(f"--- {inc['family']}: ended by {inc['end_reason']}; usage {inc.get('usage')}")
                  for cmd in inc["commands"]:
                      print("   ", str(cmd)[:200])
          PY

  wiring:
    if: inputs.run == 'wiring'
    permissions:
      contents: read
      id-token: write      # the run's own signing identity
      attestations: write  # to store the signatures with the repository
    uses: Sid00011/Flagwake/.github/workflows/check.yml@v0.5.0rc5
    with:
      agent: reference:model --dry
      pack: practice
      seeds: "1"
      defender-env: FLAGWAKE_LLM_KEY=GEMINI_API_KEY
      name: wiring
    secrets: inherit

  pick:
    if: inputs.run != 'wiring' && inputs.run != 'smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      models: ${{ steps.pick.outputs.models }}
      agent: ${{ steps.pick.outputs.agent }}
      pack: ${{ steps.pick.outputs.pack }}
      seeds: ${{ steps.pick.outputs.seeds }}
      step-timeout: ${{ steps.pick.outputs.step-timeout }}
      incident-timeout: ${{ steps.pick.outputs.incident-timeout }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: The settings and models of this run, from settings.json
        id: pick
        env:
          RUN: ${{ inputs.run }}
        run: |
          python3 -I - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          run = os.environ["RUN"]
          cfg = json.load(open("settings.json", encoding="utf-8"))
          chosen = [m for m in cfg["models"] if run == "models" or m["name"] == run]
          if not chosen:
              raise SystemExit(f"{run!r} is not in settings.json")
          print("models=" + json.dumps(chosen, separators=(",", ":")))
          for key in ("agent", "pack", "seeds", "step-timeout", "incident-timeout"):
              print(f"{key}={cfg[key]}")
          PY

  model:
    needs: pick
    strategy:
      fail-fast: false
      max-parallel: 1  # one at a time: attempt numbers in order, and no shared rate limit
      matrix:
        include: ${{ fromJSON(needs.pick.outputs.models) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: Sid00011/Flagwake/.github/workflows/check.yml@v0.5.0rc5
    with:
      agent: ${{ needs.pick.outputs.agent }}
      pack: ${{ needs.pick.outputs.pack }}
      seeds: ${{ needs.pick.outputs.seeds }}
      step-timeout: ${{ needs.pick.outputs.step-timeout }}
      incident-timeout: ${{ needs.pick.outputs.incident-timeout }}
      defender-vars: |
        FLAGWAKE_LLM_BASE_URL=${{ matrix.base }}
        FLAGWAKE_LLM_MODEL=${{ matrix.model }}
        FLAGWAKE_LLM_EXTRA_BODY=${{ matrix.extra }}
      defender-env: FLAGWAKE_LLM_KEY=${{ matrix.key }}
      name: result-${{ matrix.name }}
    secrets: inherit
